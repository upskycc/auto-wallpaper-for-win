[package]
name = "wallshift"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Windows service that rotates wallpaper and lock screen from HTTP image URLs"
publish = false

[dependencies]
anyhow = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
