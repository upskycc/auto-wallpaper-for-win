name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/WallShift"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wallshift.exe $out/
          Copy-Item scripts/install.ps1 $out/
          Copy-Item scripts/uninstall.ps1 $out/
          Copy-Item config.example.toml $out/
          Copy-Item README.md $out/
          @"
          WallShift

          Windows 10/11 x64. Run install.ps1 as Administrator in this folder.

          Layout after install:
            bin\wallshift.exe
            config\config.toml
            cache\

          1. Right-click install.ps1 -> Run with PowerShell (Administrator)
          2. Edit config\config.toml to change sources and intervals
          3. Uninstall: run uninstall.ps1 as Administrator

          Commands (from bin\):
            wallshift.exe once
            wallshift.exe run
          "@ | Set-Content -Encoding utf8 $out/README.txt
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath dist/WallShift-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallShift-windows-x64
          path: dist/WallShift-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WallShift-windows-x64.zip
          generate_release_notes: true
